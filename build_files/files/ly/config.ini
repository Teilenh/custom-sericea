# Ly display manager configuration
# Full reference: https://github.com/fairyglade/ly

# Animation type: 0=none, 1=matrix, 2=doom
animate = 2

# Default session (points to sway)
default_session = sway

# Prompt for username
hide_borders = false

# Vi mode in input fields
vi_mode = false

# Clock format (empty = disabled)
clock = %Y-%m-%d %H:%M

# Language
lang = en

# Path to xinitrc (unused for Wayland but kept for compatibility)
xinitrc = /etc/X11/xinit/xinitrc
